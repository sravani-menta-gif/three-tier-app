name: SBOM Attestation

on:
  workflow_run:
    workflows:
      - Image SBOM Generation
    types:
      - completed

jobs:
  sbom-attestation:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - frontend
          - backend

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Image SBOM
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}-image-sbom
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Image Digest
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and Validate Image Digest
        id: digest
        shell: bash
        run: |
          digest="$(cat "${{ matrix.image }}.txt")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest Image SBOM
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          cosign attest --yes --type cyclonedx --predicate "${IMAGE_NAME}-image-sbom.json" "$IMAGE_REF"

      - name: Verify SBOM Attestation
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          IDENTITY_REGEX: https://github.com/${{ github.repository }}/\.github/workflows/sbom-attestation\.yml@refs/heads/main
        run: |
          cosign verify-attestation --type cyclonedx --certificate-oidc-issuer="$OIDC_ISSUER" --certificate-identity-regexp="$IDENTITY_REGEX" "$IMAGE_REF"
