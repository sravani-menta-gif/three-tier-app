name: Image SBOM Generation

on:
  workflow_run:
    workflows:
      - Docker Build and Publish
    types:
      - completed

jobs:
  image-sbom:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        image:
          - frontend
          - backend

    steps:
      - name: Download Image Digest
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Image Digest
        id: digest
        shell: bash
        run: |
          digest="$(cat "${{ matrix.image }}.txt")"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $digest"
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx
          output: ${{ matrix.image }}-image-sbom.json

      - name: Upload Image SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-image-sbom
          path: ${{ matrix.image }}-image-sbom.json
          retention-days: 30

      - name: Upload Image Digest for Attestation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-digest
          path: ${{ matrix.image }}.txt
          retention-days: 30
